<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products – ShopWave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR (same across all pages) -->
  <nav class="navbar navbar-expand-lg sticky-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-icon"><i class="bi bi-bag-heart-fill"></i></span> ShopWave
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <form class="d-flex search-form" id="navSearchForm">
            <input class="form-control search-input" type="search" id="navSearchInput" placeholder="Search products…" />
            <button class="btn btn-search" type="submit"><i class="bi bi-search"></i></button>
          </form>
          <a href="cart.html" class="cart-btn">
            <i class="bi bi-bag"></i>
            <span class="cart-badge" id="cartCount">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="container">
      <h1 class="page-title">All Products</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active">Products</li>
        </ol>
      </nav>
    </div>
  </div>

  <div class="container py-5">
    <div class="row g-4">

      <!-- =============================================
           LEFT SIDEBAR: Filters
      ============================================= -->
      <div class="col-lg-3">
        <div class="filter-sidebar">

          <!-- Category filter -->
          <div class="filter-group">
            <h6 class="filter-title"><i class="bi bi-grid-3x3-gap me-2"></i>Category</h6>
            <div class="filter-options" id="categoryFilters">
              <!-- Built by JS -->
            </div>
          </div>

          <!-- Price range filter -->
          <div class="filter-group">
            <h6 class="filter-title"><i class="bi bi-currency-rupee me-2"></i>Price Range</h6>
            <input type="range" class="form-range" id="priceRange"
                   min="0" max="100000" step="500" value="100000" />
            <div class="d-flex justify-content-between small text-muted">
              <span>₹0</span>
              <span id="priceRangeVal">₹1,00,000</span>
            </div>
          </div>

          <!-- Rating filter -->
          <div class="filter-group">
            <h6 class="filter-title"><i class="bi bi-star me-2"></i>Min Rating</h6>
            <div class="rating-filter" id="ratingFilters">
              <label><input type="radio" name="rating" value="0" checked /> All ratings</label>
              <label><input type="radio" name="rating" value="4" /> 4★ & above</label>
              <label><input type="radio" name="rating" value="3" /> 3★ & above</label>
            </div>
          </div>

          <!-- Reset button -->
          <button class="btn btn-outline-secondary w-100 mt-2" id="resetFilters">
            <i class="bi bi-x-circle me-2"></i>Reset Filters
          </button>

        </div>
      </div>

      <!-- =============================================
           RIGHT: Toolbar + Product grid
      ============================================= -->
      <div class="col-lg-9">

        <!-- Toolbar: search box + sort + count -->
        <div class="products-toolbar d-flex flex-wrap align-items-center gap-3 mb-4">
          <div class="flex-grow-1">
            <input type="text" class="form-control search-input-lg"
                   id="productSearch" placeholder="🔍  Search products…" />
          </div>
          <div class="d-flex align-items-center gap-3">
            <span class="products-count text-muted small" id="productsCount"></span>
            <select class="form-select sort-select" id="sortSelect">
              <option value="default">Sort: Default</option>
              <option value="price-asc">Price: Low → High</option>
              <option value="price-desc">Price: High → Low</option>
              <option value="rating-desc">Rating: Best First</option>
              <option value="name-asc">Name: A → Z</option>
            </select>
          </div>
        </div>

        <!-- Product cards grid — filled by script.js -->
        <div class="row g-4" id="productGrid">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        </div>

        <!-- Empty state (shown if no products match filters) -->
        <div id="emptyState" class="empty-state d-none text-center py-5">
          <i class="bi bi-search display-1 text-muted"></i>
          <h4 class="mt-3">No products found</h4>
          <p class="text-muted">Try adjusting your search or filters.</p>
          <button class="btn btn-primary-custom" id="clearAll">Clear All Filters</button>
        </div>

      </div>
    </div>
  </div>


  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 ShopWave | Founded by Jainam Shah |
          All rights reserved. </p>
      </div>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999;">
    <div id="cartToast" class="toast align-items-center text-white border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage">✅ Added to cart!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
